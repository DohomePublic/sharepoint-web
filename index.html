<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOHOME SharePoint</title>

    <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f6f8;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #0067b8;
            color: white;
            font-size: 16px;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eee;
        }

        #status {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>DOHOME SharePoint</h1>

    <button onclick="login()">
        Login with Microsoft
    </button>

    <div id="status"></div>

    <table id="dataTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
            </tr>
        </thead>

        <tbody></tbody>
    </table>


<script>

const msalConfig = {

    auth: {

        clientId:
            "012ac5e6-9487-4436-9e0e-246c19ab2a67",

        authority:
            "https://login.microsoftonline.com/7f8918d9-718a-495b-ac9a-17cba381c4a0",

        redirectUri:
            "https://dohomepublic.github.io/sharepoint-web/"

    }

};


const msalInstance =
    new msal.PublicClientApplication(msalConfig);


const loginRequest = {

    scopes: [
        "https://dohomegroup.sharepoint.com/AllSites.Read"
    ]

};


async function login() {

    try {

        const loginResponse =
            await msalInstance.loginPopup(loginRequest);

        console.log(loginResponse);

        document.getElementById("status").innerText =
            "Login สำเร็จ กำลังโหลดข้อมูล...";

        await getSharePointData();

    }

    catch (error) {

        console.error(error);

        document.getElementById("status").innerText =
            "Login Error: " + error.message;

    }

}


async function getSharePointData() {

    try {

        const accounts =
            msalInstance.getAllAccounts();

        const account = accounts[0];

        const tokenResponse =
            await msalInstance.acquireTokenSilent({

                ...loginRequest,

                account: account

            });


        const apiUrl =
            "https://dohomegroup.sharepoint.com/sites/KYC" +
            "/_api/web/GetList('/sites/KYC/Lists/Master_TambonThai')" +
            "/items?$top=100";


        const response =
            await fetch(apiUrl, {

                method: "GET",

                headers: {

                    "Authorization":
                        "Bearer " +
                        tokenResponse.accessToken,

                    "Accept":
                        "application/json;odata=nometadata"

                }

            });


        if (!response.ok) {

            throw new Error(
                "SharePoint API Error: " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(data);


        const tbody =
            document.querySelector("#dataTable tbody");


        tbody.innerHTML = "";


        data.value.forEach(item => {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${item.Id ?? ""}
                </td>

                <td>
                    ${item.Title ?? ""}
                </td>

            `;


            tbody.appendChild(row);

        });


        document.getElementById("status").innerText =
            "โหลดข้อมูลสำเร็จ: " +
            data.value.length +
            " รายการ";

    }

    catch (error) {

        console.error(error);

        document.getElementById("status").innerText =
            "เกิดข้อผิดพลาด: " +
            error.message;

    }

}

</script>

</body>
</html>
